name: Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  # Auto-generated by "npm init playwright@latest"
  # Reference: https://playwright.dev/docs/ci-intro
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright/playwright-report/
        retention-days: 30

  # Manually added based on the official Karate demo project (Tests job, simplified for external site testing)
  # Reference: https://github.com/karatelabs/karate-todo/blob/main/.github/workflows/cicd.yml
  karate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: karate
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'microsoft'
    - name: Run Karate tests
      run: mvn test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: karate-report
        path: karate/target/karate-reports/
        retention-days: 30
